<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thi trực tuyến · Làm bài</title>
  <link rel="stylesheet" href="/css/exam.css">
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body class="exam-page">
  <header class="app-header">
    <div class="header-left">
      <span class="brand-icon-wrap" aria-hidden="true">📖</span>
      <div class="brand-info">
        <span class="brand-name">Thi trực tuyến</span>
        <span class="brand-subtitle">HỌC SINH</span>
      </div>
    </div>
    <div class="header-right">
      <div class="avatar-wrap">
        <div class="user-avatar" id="examAvatar" title="{{NAME}}">HS</div>
        <span class="online-dot"></span>
      </div>
      <form method="post" action="/logout" style="margin:0;display:inline-flex;">
        <button type="submit" class="logout-pill-btn" title="Đăng xuất">
          <span class="logout-icon">⎋</span>
          <span class="logout-text">Đăng xuất</span>
        </button>
      </form>
    </div>
  </header>
  <main class="exam-main">
    {{EXAM}}
  </main>
  {{SCRIPT}}
  <script>
    (function() {
      const el = document.getElementById('examAvatar');
      if (!el) return;
      const name = (el.getAttribute('title') || '').trim();
      const parts = name.split(/\s+/).filter(Boolean);
      el.textContent = parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : (name[0] || 'HS').toUpperCase();
    })();
  </script>
</body>
</html>
